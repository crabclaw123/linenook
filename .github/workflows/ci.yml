name: LineNook checks

on:
  push:
    branches:
      - 'feature/**'
      - 'qa/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:run
      - name: Run ESLint
        run: npm run lint
      - name: Build app
        run: npm run build
